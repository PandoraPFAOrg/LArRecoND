name: "Build Pandora Software Stack"
description: "Builds Pandora stack using the native Alma9-style script with CI dependency setup"

inputs:
  source-dir:
    description: LArRecoND source tree to build (defaults to the workspace)
    required: false
    default: ${{ github.workspace }}

runs:
  using: "composite"
  steps:
    - name: Prepare Pandora Workspace
      shell: bash
      run: |
        rm -rf /pandora/LArRecoND
        cp -r "${{ inputs.source-dir }}" /pandora/LArRecoND
        chmod +x /pandora/LArRecoND/scripts/build/build.sh

    - name: Define Environment
      shell: bash
      run: |
        rm -f /pandora/setup.sh
        echo 'source /pandora/root/bin/thisroot.sh' >> /pandora/setup.sh
        echo 'export PANDORA_PROJECT_DIR=/pandora' >> /pandora/setup.sh
        echo 'export MY_TEST_AREA=/pandora' >> /pandora/setup.sh
        echo 'export TORCH_PREFIX=/pandora/libtorch' >> /pandora/setup.sh
        echo 'export CMAKE_PREFIX_PATH=/pandora/libtorch:$CMAKE_PREFIX_PATH' >> /pandora/setup.sh
        echo 'export FW_SEARCH_PATH=/pandora/LArRecoND/settings' >> /pandora/setup.sh
        echo 'export FW_SEARCH_PATH=$FW_SEARCH_PATH:/pandora/LArMachineLearningData/' >> /pandora/setup.sh

    - name: Generate ML Data Cache Key
      id: ml-cache-key
      shell: bash
      run: |
        ML_VERSION=$(sed -n 's/^export PANDORA_LAR_MLDATA_VERSION=//p' /pandora/LArRecoND/scripts/tags.sh)
        test -n "$ML_VERSION"
        echo "key=ml-data-${{ runner.os }}-${ML_VERSION}" >> "$GITHUB_OUTPUT"

    - name: ML Data Cache
      uses: actions/cache@v6
      with:
        path: /pandora/LArMachineLearningData
        key: ${{ steps.ml-cache-key.outputs.key }}

    - name: Build Pandora Stack
      shell: bash
      run: |
        source /pandora/setup.sh
        bash /pandora/LArRecoND/scripts/build/build.sh
